# Per-source rate limiting for the Easy Door nameserver.
#
# The DigitalOcean Cloud Firewall is the actual firewall and this table adds
# nothing to it, so the policy is accept and only the rate limits live here.
#
# Reflection attacks spoof the victim's address as the source, so a per-source
# cap is what bounds how much traffic this box can be made to send at any one
# target. The limits are set well above what a busy recursive resolver asks for.
#
# CoreDNS has no response-rate-limiting plugin in a stock build. If abuse ever
# outgrows this, the upgrade is a custom CoreDNS build with the external `rrl`
# plugin, which suppresses repeated identical responses rather than packets.

table inet mos-nameserver {
	chain input {
		type filter hook input priority filter; policy accept;

		udp dport 53 meter dns-udp-per-src size 65535 \
			{ ip saddr limit rate over 100/second burst 200 packets } drop
		udp dport 53 meter dns-udp-per-src6 size 65535 \
			{ ip6 saddr limit rate over 100/second burst 200 packets } drop

		tcp dport 53 meter dns-tcp-per-src size 65535 \
			{ ip saddr limit rate over 50/second burst 100 packets } drop
		tcp dport 53 meter dns-tcp-per-src6 size 65535 \
			{ ip6 saddr limit rate over 50/second burst 100 packets } drop
	}
}
