# Per-source rate limits for the ACME responder. The DigitalOcean Cloud Firewall
# is the actual firewall; only the limits live here. A box makes a handful of
# API calls per issuance, and a validating CA a handful of DNS queries.

table inet mos-acme-responder {
	chain input {
		type filter hook input priority filter; policy accept;

		udp dport 53 meter acme-dns-udp size 65535 \
			{ ip saddr limit rate over 50/second burst 100 packets } drop
		udp dport 53 meter acme-dns-udp6 size 65535 \
			{ ip6 saddr limit rate over 50/second burst 100 packets } drop
		tcp dport 53 meter acme-dns-tcp size 65535 \
			{ ip saddr limit rate over 25/second burst 50 packets } drop
		tcp dport 53 meter acme-dns-tcp6 size 65535 \
			{ ip6 saddr limit rate over 25/second burst 50 packets } drop

		tcp dport { 80, 443 } ct state new meter acme-api size 65535 \
			{ ip saddr limit rate over 5/second burst 20 packets } drop
		tcp dport { 80, 443 } ct state new meter acme-api6 size 65535 \
			{ ip6 saddr limit rate over 5/second burst 20 packets } drop
	}
}
