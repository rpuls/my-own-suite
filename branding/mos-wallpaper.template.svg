<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1920" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="{{BG_SOFT}}"/>
      <stop offset="1" stop-color="{{BG}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(960 850) scale(800 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="{{ACCENT}}" stop-opacity="0.07"/>
      <stop offset="1" stop-color="{{ACCENT}}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#canvas)" d="M0 0h1920v1200H0z"/>
  <path fill="url(#glow)" d="M0 0h1920v1200H0z"/>
  <svg x="750" y="640" width="420" height="420" viewBox="0 0 100 100" opacity="0.13" style="--mos-mark-color: {{ACCENT}};">
    {{MARK}}
  </svg>
  <text x="960" y="1130" fill="{{TEXT_MUTED}}" fill-opacity="0.46" font-family="'Open Sans', system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="5" text-anchor="middle">MY OWN SUITE</text>
</svg>
