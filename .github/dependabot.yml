version: 2
# App packages are not here: Norn updates them, moving a pin together with the package
# version, privacy review and catalog, which a Dependabot pull request cannot do.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      site-npm:
        patterns:
          - "*"

  # The planner pins exact versions, so without this entry nothing would ever
  # bump them, security patches included.
  - package-ecosystem: "npm"
    directory: "/site/planner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      planner-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/infrastructure/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
