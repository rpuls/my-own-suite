version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/infrastructure/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/actual-budget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:50"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/immich"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/onlyoffice"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:10"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/radicale"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:20"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/seafile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "mysql"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/apps/paperless-ngx"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:35"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/stirling-pdf"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:40"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/vaultwarden"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:50"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
