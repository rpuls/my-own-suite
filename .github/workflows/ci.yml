name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: MOS Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check app catalog and advisory feed
        run: npm run apps:catalog:check

      - name: Validate app privacy reviews
        run: npm run apps:privacy:check

      - name: Monitor stale reviews and advisories
        run: npm run apps:privacy:monitor

      - name: Typecheck Suite Manager
        run: npm run typecheck

      - name: Build Suite Manager client
        run: npm run build:client

      - name: Render installer contract
        run: npm run install:render -- --target json

      - name: Check release metadata
        run: npm run release:check

  site-reference:
    name: Public Site (MOS1 Reference)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-mos1-reference/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      - name: Build preserved public site
        run: npm run build

  shellcheck:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
