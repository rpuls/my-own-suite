name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: MOS Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Check app catalog and advisory feed
        run: npm run apps:catalog:check

      # The guard compares against the catalog installed boxes actually read, so
      # the default shallow checkout has to be given that branch first.
      - name: Fetch published catalog branch
        run: git fetch --depth=1 origin main

      - name: Check app package versions against the published catalog
        run: npm run apps:version:check -- --require-baseline

      - name: Validate app privacy reviews
        run: npm run apps:privacy:check

      - name: Monitor stale reviews and advisories
        run: npm run apps:privacy:monitor

      - name: Check documentation claims against the repository
        run: npm run docs:claims

      - name: Typecheck Suite Manager
        run: npm run typecheck

      - name: Build Suite Manager client
        run: npm run build:client

      - name: Render installer contract
        run: npm run install:render -- --target json

      - name: Check release metadata
        run: npm run release:check

  site:
    name: MOS Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site/planner/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Install planner dependencies
        run: npm ci
        working-directory: site/planner

      # `npm run build` also builds the Digital Independence Planner
      # (site/planner) into site/dist/plan, so the planner's dependencies must
      # be installed first.
      - name: Build MOS site
        run: npm run build
        working-directory: site

      # Both checks run against the built site as a browser would see it, so
      # root-relative links and rendered markup are what gets checked rather than
      # source files. Versions are pinned because CI otherwise resolves whatever
      # was published that morning.
      - name: Serve the built site
        run: |
          nohup npx --yes http-server@14.1.1 site/dist -p 4321 --silent > /tmp/http-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 5 http://127.0.0.1:4321/ > /dev/null; then
              echo "site is answering after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "site did not answer on http://127.0.0.1:4321/ within 30 attempts"
          cat /tmp/http-server.log
          exit 1

      # `--accept` replaces lychee's default set rather than extending it, so the
      # default 1xx/2xx range is restated. 429 is rate limiting rather than a dead
      # link, so it is retried and then accepted; a 503 is not, because a host
      # that is down answers with one and must fail the job.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept '100..=103,200..=299,429'
            --base-url http://127.0.0.1:4321
            site/dist
          fail: true

      - name: Check accessibility
        run: npx --yes pa11y-ci@4.1.1 --config site/.pa11yci.json

  shellcheck:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
