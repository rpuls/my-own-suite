name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: MOS Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      # Every check this job runs is defined in scripts/checks.cjs, which is
      # also what `npm test`, the release gate and the pre-push hook run. Adding
      # a step here instead would make CI diverge from what a push can be tested
      # against, which is the whole thing this file stopped doing.
      - name: Run workspace checks
        run: npm run check:workspace

  site:
    name: MOS Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site/planner/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.2.0

      # The planner's prebuild fetches the pinned Dashboard Icons commit from
      # GitHub (~80 MB) unless a checkout for that commit already exists. Keyed
      # on the pin, so bumping it refetches and a docs-only push does not.
      # Restored before the build below, which is what populates it.
      - name: Cache the pinned Dashboard Icons checkout
        uses: actions/cache@v4
        with:
          path: site/planner/.cache/dashboard-icons
          key: dashboard-icons-${{ hashFiles('site/planner/icon-source.json') }}

      # Installs, the site and planner build, the planner's tests and the
      # accessibility check, all defined in scripts/checks.cjs alongside the
      # workspace lane. The accessibility check serves site/dist itself.
      - name: Run site checks
        run: npm run check:site

      # The link report runs against the built site as a browser would see it,
      # so root-relative links and rendered markup are what gets checked rather
      # than source files. Versions are pinned because CI otherwise resolves
      # whatever was published that morning.
      - name: Serve the built site
        run: |
          nohup npx --yes http-server@14.1.1 site/dist -p 4321 --silent > /tmp/http-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 5 http://127.0.0.1:4321/ > /dev/null; then
              echo "site is answering after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "site did not answer on http://127.0.0.1:4321/ within 30 attempts"
          cat /tmp/http-server.log
          exit 1

      # `--accept` replaces lychee's default set rather than extending it, so the
      # default 1xx/2xx range is restated. 429 is rate limiting rather than a dead
      # link, so it is retried and then accepted.
      #
      # Reports, never gates. The step reaches ~110 third-party hosts, so a red run
      # means "somebody else's server was down for the six seconds we asked", not
      # "this branch is broken" — and gating on it blocked every merge for three days
      # while finding one real broken link. Findings stay in the job summary, which is
      # where link rot belongs: something to read, not something to be held up by.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept '100..=103,200..=299,429'
            --base-url http://127.0.0.1:4321
            site/dist
          fail: false

  shellcheck:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
