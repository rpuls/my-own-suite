name: Release

# Pushing the tag is the whole release. Everything below is automatic, and every
# step that could publish something wrong is gated by the same `release:check`
# the maintainer runs locally — so a tag cannot reach the publish step by
# skipping a check, and a failing gate leaves no release behind at all.
on:
  push:
    tags:
      - 'v*'
  # The same build, on demand. It proves the image build and the R2 upload work
  # before a tag exists, which is the part of a release that cannot be undone by
  # moving a tag. The publish job is skipped and the image lands under a scratch
  # prefix, so a dispatch run can never be mistaken for a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  # The bucket and hostname the image is served from. Changing these changes the
  # download URL printed in the release notes and in the docs.
  R2_BUCKET: mos-downloads
  DOWNLOAD_HOST: downloads.myownsuite.org

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # The bake seed pins itself to this tag by asking git whether the tag
          # really contains the layout it is about to install, so the full
          # history and tags have to be present.
          fetch-depth: 0

      # A tag can be pushed from any commit, including one that never went
      # through a pull request. Everything else here checks what the release
      # says about itself; this checks that the code in it is the code that was
      # reviewed and merged. It runs before the install so it fails in seconds.
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Read the version from the tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Pin npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      # Skipped on a dispatch run: there is no tag to check the metadata against,
      # and `npm test` above has already run the ordinary self-consistency form.
      - name: Release gate
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check -- --release "${GITHUB_REF_NAME}"

  # The published download. It is a prebuilt disk image: the machine is installed
  # once here, in a VM, and every owner flashes the finished result — so the
  # partition table and bootloader are decided by this job rather than by whatever
  # mode a stranger's firmware happened to boot the stick in.
  #
  # The installer ISO is still built, inside `bake.sh iso`, because the image is
  # baked by running it. It is no longer uploaded or linked anywhere.
  disk-image:
    name: Build the disk image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      # The bake needs room for the Ubuntu ISO, the remastered ISO, a 16 GB
      # qcow2, the raw image and its compressed copy at the same time.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install QEMU and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf mtools gdisk fdisk e2fsprogs xz-utils
          # Nested virtualisation is available on these runners, but the runner
          # user is not in the kvm group and a group change needs a new login.
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm && echo 'KVM is usable.'

      - name: Decide where this build goes
        id: target
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'prefix=dry-run' >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Same publishability gates the ISO gets. A disk image is flashed by
      # everyone who downloads it, so a baked-in password would be shared by
      # every machine in the world.
      - name: Render and check the bake seed
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: |
          bash ./image-builder/bake.sh seed
          seed='image-builder/.work/seed/user-data'
          summary='image-builder/.work/seed/bake-summary.json'

          if ! grep -q "MOS_REPO_REF='${GITHUB_REF_NAME}'" "$seed"; then
            echo "::error::The seed does not pin ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [ "$(node -p "require('./$summary').consoleLoginHandover")" != 'first-boot' ]; then
            echo '::error::This seed carries a build-time password. Every machine flashed from it would share one login.'
            exit 1
          fi
          if [ "$(node -p "require('./$summary').profile")" != 'release' ]; then
            echo '::error::This is a debug bake and must not be published.'
            exit 1
          fi
          if ! grep -q "MOS_DISPOSABLE_LAB='0'" "$seed"; then
            echo '::error::This seed enables the lab reset agent.'
            exit 1
          fi

      - name: Bake
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: |
          bash ./image-builder/bake.sh iso
          bash ./image-builder/bake.sh bake

      - name: Convert, shrink and compress
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: bash ./image-builder/bake.sh convert

      # Verify boots the image on a disk larger than itself, so it needs room for
      # a 40 GB sparse copy. The baked disk and the installer ISO are finished
      # with by this point and together hold about 12 GB.
      - name: Drop the bake intermediates
        run: |
          rm -f image-builder/.work/bake.qcow2 image-builder/.work/bake-installer.iso
          df -h /

      # The gate the ISO never had: boot what is about to be published and make
      # it answer, before anything is uploaded. A boot-layout regression cannot
      # reach a download from here.
      - name: Boot the published image and require Suite Manager to answer
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: bash ./image-builder/bake.sh verify

      # aws-cli rather than wrangler: `wrangler r2 object put` uploads in a single
      # request and this file is gigabytes, so it needs the S3 API's multipart
      # upload. R2 speaks it, and the CLI is already on the runner.
      - name: Upload the disk image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          cd image-builder/.work/out
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"
          aws s3 cp "$image" "s3://${R2_BUCKET}/${PREFIX}/${image}" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          aws s3 cp SHA256SUMS "s3://${R2_BUCKET}/${PREFIX}/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          echo "Published to https://${DOWNLOAD_HOST}/${PREFIX}/${image}"
          ls -lh

      # A step log is the one place nobody looks. GitHub renders this at the top
      # of the run page, so the notification that the build finished lands one
      # click away from the link, the checksum and the commit it came from.
      - name: Write the download to the run summary
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          cd image-builder/.work/out
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"
          url="https://${DOWNLOAD_HOST}/${PREFIX}/${image}"
          sha="$(awk -v f="$image" '$2 == f { print $1 }' SHA256SUMS)"
          {
            echo "## Disk image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Download | <${url}> |"
            echo "| SHA256 | \`${sha}\` |"
            echo "| Size | $(du -h "$image" | cut -f1) |"
            echo "| Built from | \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:12}\` |"
            echo "| Built at | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            if [ "$PREFIX" = 'dry-run' ]; then
              echo "Not a release. The next tagged release deletes this prefix."
            fi
            echo "Same link, always current: <https://${DOWNLOAD_HOST}/builds/index.html>"
          } >> "$GITHUB_STEP_SUMMARY"

      # An unlisted index on the download host itself, so a maintainer has one
      # bookmark instead of the Cloudflare dashboard. It lives here rather than
      # in `site/` for three reasons: same origin as the artifact, so it needs no
      # CORS rule; it never enters the public site build or `main`; and it is
      # rewritten by the build that publishes the image, so it cannot describe
      # one that was never uploaded. Every CI build overwrites it, so after a
      # release it names the release image rather than a staging one the prune
      # step below is about to delete.
      - name: Refresh the unlisted build index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          cd image-builder/.work/out
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"
          url="https://${DOWNLOAD_HOST}/${PREFIX}/${image}"
          sha="$(awk -v f="$image" '$2 == f { print $1 }' SHA256SUMS)"
          size="$(du -h "$image" | cut -f1)"
          built="$(date -u '+%Y-%m-%d %H:%M UTC')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$PREFIX" = 'dry-run' ]; then
            kind='Staging build'
            note='Not a release, and not for anyone else to install. The next tagged release deletes this file.'
          else
            kind='Release build'
            note='This is the published release image. It stays until two newer releases exist.'
          fi

          cat > index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex, nofollow">
          <title>MOS CI builds</title>
          <style>
            :root { color-scheme: light dark; }
            body { margin: 0; padding: 2.5rem 1.25rem; font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; }
            main { max-width: 46rem; margin: 0 auto; }
            h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
            p.sub { margin: 0 0 2rem; opacity: .7; }
            table { border-collapse: collapse; width: 100%; margin: 0 0 1.5rem; }
            th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid rgba(128,128,128,.28); vertical-align: top; }
            th { width: 9.5rem; font-weight: 600; opacity: .75; }
            code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .87em; word-break: break-all; }
            a.dl { display: inline-block; font-weight: 600; }
            .note { padding: .85rem 1rem; border-left: 3px solid rgba(128,128,128,.5); opacity: .85; margin: 0 0 1.5rem; }
            footer { margin-top: 2.5rem; font-size: .85rem; opacity: .6; }
          </style>
          </head>
          <body>
          <main>
            <h1>My Own Suite &mdash; CI builds</h1>
            <p class="sub">Unlisted. This page is written by the release workflow and is not linked from anywhere.</p>
            <p class="note">${kind}. ${note}</p>
            <table>
              <tr><th>Download</th><td><a class="dl" href="${url}">${image}</a></td></tr>
              <tr><th>SHA256</th><td><code>${sha}</code></td></tr>
              <tr><th>Size</th><td>${size}</td></tr>
              <tr><th>Built from</th><td><code>${GITHUB_REF_NAME}</code> @ <code>${GITHUB_SHA}</code></td></tr>
              <tr><th>Built at</th><td>${built}</td></tr>
              <tr><th>Workflow run</th><td><a href="${run_url}">#${GITHUB_RUN_NUMBER}</a></td></tr>
            </table>
            <p>Verify before flashing:</p>
            <p><code>shasum -a 256 ${image}</code> &nbsp;/&nbsp; <code>certutil -hashfile ${image} SHA256</code></p>
            <footer>Looking for the supported download? <a href="https://myownsuite.org/docs/install/own-hardware/">myownsuite.org</a></footer>
          </main>
          </body>
          </html>
          HTML

          aws s3 cp index.html "s3://${R2_BUCKET}/builds/index.html" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32 \
            --content-type 'text/html; charset=utf-8' --cache-control 'no-cache'
          echo "Build index: https://${DOWNLOAD_HOST}/builds/index.html"

      # The checksum belongs on GitHub rather than beside the image: one served
      # from the same host as the bytes it describes proves only that the host is
      # consistent with itself.
      - name: Keep the checksum and the bake log
        uses: actions/upload-artifact@v4
        with:
          name: disk-image-evidence
          path: |
            image-builder/.work/out/SHA256SUMS
            image-builder/.work/out/mos-image-build.log
          retention-days: 7

  publish:
    name: Publish release
    needs: [gate, disk-image]
    # Only a tag publishes. A dispatch run stops after proving the build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Fetch the checksum
        uses: actions/download-artifact@v4
        with:
          name: disk-image-evidence
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"
          url="https://${DOWNLOAD_HOST}/${GITHUB_REF_NAME}/${image}"
          # SHA256SUMS carries the uncompressed image too, so the line is selected
          # by name rather than by position.
          sha="$(awk -v f="$image" '$2 == f { print $1 }' dist/SHA256SUMS)"
          [ -n "$sha" ] || { echo "::error::No checksum for ${image} in SHA256SUMS."; exit 1; }

          notes="$(mktemp)"
          {
            echo "## Install on your own hardware"
            echo
            echo "This is a finished server, not an installer: the machine was installed and tested"
            echo "in CI, and you flash the result. Write it to a USB stick:"
            echo
            echo "- **Windows:** [Rufus](https://rufus.ie/), in **DD mode**. Decompress the \`.xz\` first"
            echo "  if Rufus will not open it directly."
            echo "- **macOS and Linux:** [balenaEtcher](https://etcher.balena.io/), which reads the"
            echo "  compressed file as it is."
            echo
            echo "Boot your server from the stick. It lists the disks it can install onto and what each"
            echo "one already holds, erases only the disk you pick and confirm, and is running a few"
            echo "minutes later with nothing downloaded."
            echo
            echo "**[Download ${image}](${url})** (~2 GB)"
            echo
            echo '```'
            echo "SHA256  ${sha}"
            echo '```'
            echo
            echo "Verify before flashing — \`sha256sum ${image}\` on Linux or macOS,"
            echo "\`certutil -hashfile ${image} SHA256\` on Windows. The checksum is also attached"
            echo "to this release, which is the copy to trust."
            echo
            echo "Requires a machine that boots in **UEFI** mode. The"
            echo "image contains no password: your server generates its own login the first time it"
            echo "boots, shows it on its screen and in Suite Manager, and forgets it once you confirm"
            echo "you have saved it."
            echo
            echo "Built from stock Ubuntu Server 24.04 LTS. This is an unofficial image published by"
            echo "the My Own Suite project, not affiliated with or endorsed by Canonical Ltd; Ubuntu"
            echo "is a trademark of Canonical Ltd."
            echo
            echo "---"
            echo
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
          } > "$notes"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            dist/SHA256SUMS

  # An image is only ever used to install; a server updates itself afterwards, so
  # nobody needs an old one. Keeping them costs storage the free tier does not
  # have, and a withdrawn image is the only way to stop handing out one with a
  # known flaw. Two are kept so a release whose image turns out not to boot still
  # has something to point people back to.
  prune:
    name: Prune superseded images
    needs: [gate, publish]
    runs-on: ubuntu-latest
    env:
      KEEP: 2
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Delete every image outside the keep window
        id: prune
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"

          # Nothing is deleted until the image this release just published is
          # confirmed present. A prune that runs against a failed upload would
          # empty the bucket.
          aws s3api head-object --bucket "$R2_BUCKET" \
            --key "${GITHUB_REF_NAME}/${image}" --endpoint-url "$R2_ENDPOINT" >/dev/null

          aws s3 ls "s3://${R2_BUCKET}/" --endpoint-url "$R2_ENDPOINT" \
            | awk '$1 == "PRE" { sub(/\/$/, "", $2); print $2 }' | sort > all-prefixes

          # Version-sorted, so the window follows releases rather than upload
          # order. Anything that is not a version — `dry-run/` — is never kept,
          # with one exception: `builds/` holds the unlisted index page and no
          # artifacts, so it costs kilobytes rather than gigabytes and deleting
          # it would break a bookmark on every release.
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' all-prefixes | sort -V | tail -n "$KEEP" > keep-images
          { cat keep-images; echo builds; } | sort -u > keep
          comm -23 all-prefixes <(sort keep) > remove

          if [ ! -s remove ]; then
            echo "Nothing to prune. Hosted: $(paste -sd' ' keep-images)"
            exit 0
          fi

          while read -r prefix; do
            echo "Removing s3://${R2_BUCKET}/${prefix}/"
            aws s3 rm "s3://${R2_BUCKET}/${prefix}/" --recursive --endpoint-url "$R2_ENDPOINT"
          done < remove

          echo "Hosted: $(paste -sd' ' keep-images)"
          echo "removed=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' remove | paste -sd' ' || true)" >> "$GITHUB_OUTPUT"

      # A deleted image leaves a download link on a published release page that
      # answers 404. Rewriting the notes is what turns pruning into a redirect
      # instead of a dead end.
      - name: Repoint the notes of releases whose image is gone
        if: steps.prune.outputs.removed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOVED: ${{ steps.prune.outputs.removed }}
        run: |
          set -euo pipefail
          for tag in $REMOVED; do
            gh release view "$tag" >/dev/null 2>&1 || continue

            notes="$(mktemp)"
            {
              echo "## Image withdrawn"
              echo
              echo "The image for this version is no longer hosted. Install the [current"
              echo "release](https://github.com/${GITHUB_REPOSITORY}/releases/latest) instead — a"
              echo "server installed from it arrives at this version and beyond on its own."
              echo
              echo "---"
              echo
              # Read from the changelog rather than the old notes: the tag being
              # released still carries every past section, so this cannot drift.
              sed -n "/^## \[${tag#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
            } > "$notes"

            gh release edit "$tag" --notes-file "$notes"
            echo "Repointed the notes for $tag."
          done
