name: Release

# Pushing the tag is the whole release. Everything below is automatic, and every
# step that could publish something wrong is gated by the same `release:check`
# the maintainer runs locally — so a tag cannot reach the publish step by
# skipping a check, and a failing gate leaves no release behind at all.
on:
  push:
    tags:
      - 'v*'
  # The same build, on demand. It proves the installer job and the R2 upload
  # work before a tag exists, which is the part of a release that cannot be
  # undone by moving a tag. The publish job is skipped and the image lands under
  # a scratch prefix, so a dispatch run can never be mistaken for a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  # The bucket and hostname the installer image is served from. Changing these
  # changes the download URL printed in the release notes and in the docs.
  R2_BUCKET: mos-downloads
  DOWNLOAD_HOST: downloads.myownsuite.org

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # The installer seed pins itself to this tag by asking git whether the
          # tag really contains the layout it is about to install, so the full
          # history and tags have to be present.
          fetch-depth: 0

      # A tag can be pushed from any commit, including one that never went
      # through a pull request. Everything else here checks what the release
      # says about itself; this checks that the code in it is the code that was
      # reviewed and merged. It runs before the install so it fails in seconds.
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Read the version from the tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Pin npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      # Skipped on a dispatch run: there is no tag to check the metadata against,
      # and `npm test` above has already run the ordinary self-consistency form.
      - name: Release gate
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check -- --release "${GITHUB_REF_NAME}"

  installer:
    name: Build installer image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      # The Ubuntu base is ~3.2 GB, the extracted tree another ~3.2 GB, and the
      # repacked output ~3.2 GB again. A stock runner does not have room for that
      # alongside the preinstalled toolchains it will never use here.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      # A dispatch build is a rehearsal, so it is kept out of the namespace real
      # downloads live in. Nothing ever links to dry-run/, and overwriting it on
      # every rehearsal is the point.
      - name: Decide where this build goes
        id: target
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'prefix=dry-run' >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render the installer seed pinned to this tag
        env:
          MOS_SMOKE_REPO_REF: ${{ github.ref_name }}
          # Named explicitly rather than left to the default, so this file states
          # which profile a published image is built with.
          MOS_SEED_PROFILE: release
        run: node scripts/installers/render-hyperv-usb-seed.cjs

      # Fails in seconds, before the multi-gigabyte download, on the two mistakes
      # that would otherwise be discovered by whoever flashed the image.
      - name: Verify the seed is publishable
        run: |
          seed=".mos-smoke/hyperv-usb/seed/user-data"
          summary=".mos-smoke/hyperv-usb/seed/seed-summary.json"

          if ! grep -q "MOS_REPO_REF='${GITHUB_REF_NAME}'" "$seed"; then
            echo "::error::The seed does not pin ${GITHUB_REF_NAME}. A published image must install the tagged release, not a branch."
            grep -o "MOS_REPO_REF='[^']*'" "$seed" | head -1
            exit 1
          fi

          handover="$(node -p "require('./$summary').consoleLoginHandover")"
          if [ "$handover" != 'first-boot' ]; then
            echo "::error::This seed carries a build-time password (handover=$handover). Every machine flashed from it would share one login."
            exit 1
          fi

          if ! grep -q "MOS_DISPOSABLE_LAB='0'" "$seed"; then
            echo "::error::This seed enables the lab reset agent. A published image must never carry an unauthenticated endpoint that wipes the suite."
            grep -o "MOS_DISPOSABLE_LAB='[^']*'" "$seed" | head -1
            exit 1
          fi

          echo "Seed pins ${GITHUB_REF_NAME}, bakes no password, and disables lab reset."

      - name: Build the installer ISO
        run: |
          npm run installer:usb -- \
            --seed-dir .mos-smoke/hyperv-usb/seed \
            --output-iso "dist/my-own-suite-installer-${GITHUB_REF_NAME}.iso"

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum "my-own-suite-installer-${GITHUB_REF_NAME}.iso" | tee SHA256SUMS
          ls -lh

      # aws-cli rather than wrangler: `wrangler r2 object put` uploads in a single
      # request and this file is several gigabytes, so it needs the S3 API's
      # multipart upload. R2 speaks it, and the CLI is already on the runner.
      - name: Upload the image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          aws s3 cp "dist/my-own-suite-installer-${GITHUB_REF_NAME}.iso" \
            "s3://${R2_BUCKET}/${PREFIX}/my-own-suite-installer-${GITHUB_REF_NAME}.iso" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          aws s3 cp dist/SHA256SUMS \
            "s3://${R2_BUCKET}/${PREFIX}/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32

          echo "Published to https://${DOWNLOAD_HOST}/${PREFIX}/my-own-suite-installer-${GITHUB_REF_NAME}.iso"

      # Small enough for a release asset, and it belongs on GitHub rather than
      # beside the image: a checksum served from the same host as the bytes it
      # describes proves only that the host is consistent with itself.
      - name: Keep the checksum for the release
        uses: actions/upload-artifact@v4
        with:
          name: installer-checksum
          path: dist/SHA256SUMS
          retention-days: 1

  # The prebuilt disk image (roadmap H1). Runs alongside the ISO rather than
  # replacing it: the ISO stays the supported download until this has proven
  # itself over a release or two. It publishes under a disk-image/ prefix so
  # nothing links to it by accident, and the release notes do not mention it yet.
  #
  # `publish` deliberately does not need this job. While the ISO is the supported
  # download, an experimental image must not be able to hold back a release; it
  # only gates itself, by refusing to upload an image that does not boot.
  disk-image:
    name: Build prebuilt disk image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install -g npm@11.2.0

      - name: Install dependencies
        run: npm ci

      # The bake needs room for the Ubuntu ISO, the remastered ISO, a 16 GB
      # qcow2, the raw image and its compressed copy at the same time.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install QEMU and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf mtools gdisk fdisk e2fsprogs xz-utils
          # Nested virtualisation is available on these runners, but the runner
          # user is not in the kvm group and a group change needs a new login.
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm && echo 'KVM is usable.'

      - name: Decide where this build goes
        id: target
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'prefix=dry-run' >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Same publishability gates the ISO gets. A disk image is flashed by
      # everyone who downloads it, so a baked-in password would be shared by
      # every machine in the world.
      - name: Render and check the bake seed
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: |
          bash ./image-builder/bake.sh seed
          seed='image-builder/.work/seed/user-data'
          summary='image-builder/.work/seed/bake-summary.json'

          if ! grep -q "MOS_REPO_REF='${GITHUB_REF_NAME}'" "$seed"; then
            echo "::error::The seed does not pin ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [ "$(node -p "require('./$summary').consoleLoginHandover")" != 'first-boot' ]; then
            echo '::error::This seed carries a build-time password. Every machine flashed from it would share one login.'
            exit 1
          fi
          if [ "$(node -p "require('./$summary').profile")" != 'release' ]; then
            echo '::error::This is a debug bake and must not be published.'
            exit 1
          fi
          if ! grep -q "MOS_DISPOSABLE_LAB='0'" "$seed"; then
            echo '::error::This seed enables the lab reset agent.'
            exit 1
          fi

      - name: Bake
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: |
          bash ./image-builder/bake.sh iso
          bash ./image-builder/bake.sh bake

      - name: Convert, shrink and compress
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: bash ./image-builder/bake.sh convert

      # Verify boots the image on a disk larger than itself, so it needs room for
      # a 40 GB sparse copy. The baked disk and the installer ISO are finished
      # with by this point and together hold about 12 GB.
      - name: Drop the bake intermediates
        run: |
          rm -f image-builder/.work/bake.qcow2 image-builder/.work/bake-installer.iso
          df -h /

      # The gate the ISO never had: boot what is about to be published and make
      # it answer, before anything is uploaded. A boot-layout regression cannot
      # reach a download from here.
      - name: Boot the published image and require Suite Manager to answer
        env:
          MOS_IMAGE_REPO_REF: ${{ github.ref_name }}
        run: bash ./image-builder/bake.sh verify

      - name: Upload the disk image to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          cd image-builder/.work/out
          image="my-own-suite-${GITHUB_REF_NAME}.img.xz"
          aws s3 cp "$image" "s3://${R2_BUCKET}/${PREFIX}/disk-image/${image}" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          aws s3 cp SHA256SUMS "s3://${R2_BUCKET}/${PREFIX}/disk-image/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT" --checksum-algorithm CRC32
          echo "Published to https://${DOWNLOAD_HOST}/${PREFIX}/disk-image/${image}"
          ls -lh

      - name: Keep the checksum and the bake log
        uses: actions/upload-artifact@v4
        with:
          name: disk-image-evidence
          path: |
            image-builder/.work/out/SHA256SUMS
            image-builder/.work/out/mos-image-build.log
          retention-days: 7

  publish:
    name: Publish release
    needs: [gate, installer]
    # Only a tag publishes. A dispatch run stops after proving the build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Fetch the checksum
        uses: actions/download-artifact@v4
        with:
          name: installer-checksum
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          iso="my-own-suite-installer-${GITHUB_REF_NAME}.iso"
          url="https://${DOWNLOAD_HOST}/${GITHUB_REF_NAME}/${iso}"
          sha="$(cut -d' ' -f1 < dist/SHA256SUMS)"

          notes="$(mktemp)"
          {
            echo "## Install on your own hardware"
            echo
            echo "Download the installer image, write it to a USB stick with"
            echo "[Rufus](https://rufus.ie/) or [balenaEtcher](https://etcher.balena.io/), and boot the"
            echo "server from it. Nothing else to install."
            echo
            echo "**[Download ${iso}](${url})** (~3 GB)"
            echo
            echo '```'
            echo "SHA256  ${sha}"
            echo '```'
            echo
            echo "Verify before flashing — \`sha256sum ${iso}\` on Linux or macOS,"
            echo "\`certutil -hashfile ${iso} SHA256\` on Windows. The checksum is also attached"
            echo "to this release, which is the copy to trust."
            echo
            echo "The image contains no password. Your server generates its own login the first"
            echo "time it boots, shows it on its screen and in Suite Manager, and forgets it once"
            echo "you confirm you have saved it."
            echo
            echo "---"
            echo
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
          } > "$notes"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            dist/SHA256SUMS

  # An installer image is only ever used to install; a server updates itself
  # afterwards, so nobody needs an old one. Keeping them costs storage the free
  # tier does not have, and a withdrawn image is the only way to stop handing out
  # one with a known flaw. Two are kept so a release whose image turns out not to
  # boot still has something to point people back to.
  prune:
    name: Prune superseded installer images
    needs: [gate, publish]
    runs-on: ubuntu-latest
    env:
      KEEP: 2
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Delete every image outside the keep window
        id: prune
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          iso="my-own-suite-installer-${GITHUB_REF_NAME}.iso"

          # Nothing is deleted until the image this release just published is
          # confirmed present. A prune that runs against a failed upload would
          # empty the bucket.
          aws s3api head-object --bucket "$R2_BUCKET" \
            --key "${GITHUB_REF_NAME}/${iso}" --endpoint-url "$R2_ENDPOINT" >/dev/null

          aws s3 ls "s3://${R2_BUCKET}/" --endpoint-url "$R2_ENDPOINT" \
            | awk '$1 == "PRE" { sub(/\/$/, "", $2); print $2 }' | sort > all-prefixes

          # Version-sorted, so the window follows releases rather than upload
          # order. Anything that is not a version — `dry-run/` — is never kept.
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' all-prefixes | sort -V | tail -n "$KEEP" > keep
          comm -23 all-prefixes <(sort keep) > remove

          if [ ! -s remove ]; then
            echo "Nothing to prune. Hosted: $(paste -sd' ' keep)"
            exit 0
          fi

          while read -r prefix; do
            echo "Removing s3://${R2_BUCKET}/${prefix}/"
            aws s3 rm "s3://${R2_BUCKET}/${prefix}/" --recursive --endpoint-url "$R2_ENDPOINT"
          done < remove

          echo "Hosted: $(paste -sd' ' keep)"
          echo "removed=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' remove | paste -sd' ' || true)" >> "$GITHUB_OUTPUT"

      # A deleted image leaves a download link on a published release page that
      # answers 404. Rewriting the notes is what turns pruning into a redirect
      # instead of a dead end.
      - name: Repoint the notes of releases whose image is gone
        if: steps.prune.outputs.removed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOVED: ${{ steps.prune.outputs.removed }}
        run: |
          set -euo pipefail
          for tag in $REMOVED; do
            gh release view "$tag" >/dev/null 2>&1 || continue

            notes="$(mktemp)"
            {
              echo "## Installer image withdrawn"
              echo
              echo "The image for this version is no longer hosted. Install the [current"
              echo "release](https://github.com/${GITHUB_REPOSITORY}/releases/latest) instead — a"
              echo "server installed from it arrives at this version and beyond on its own."
              echo
              echo "---"
              echo
              # Read from the changelog rather than the old notes: the tag being
              # released still carries every past section, so this cannot drift.
              sed -n "/^## \[${tag#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
            } > "$notes"

            gh release edit "$tag" --notes-file "$notes"
            echo "Repointed the notes for $tag."
          done
